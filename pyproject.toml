[project]
name = "mcparasite"
version = "0.2.0"
description = "MCParasite - Universal MCP Context Worm Security Testing Framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.44.0",
    "click>=8.3.1",
    "flask>=3.1.2",
    "google-genai>=1.0.0",
    "httpx>=0.28.1",
    "mcp[cli]>=1.26.0",
    "openai>=1.60.0",
    "playwright>=1.58.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "reportlab>=4.0",
    "rich>=14.3.2",
]

[project.optional-dependencies]
# Platform-specific dependencies (install only what you need)
aws = ["boto3>=1.34.0"]
google = ["google-auth>=2.0.0", "google-api-python-client>=2.0.0"]

[project.scripts]
mcparasite = "cli:main"
mcparasite-legacy = "mcparasite.scanner.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
]
